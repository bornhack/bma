########## METADATA ##########
[project]
authors = [{name = "Thomas Steen Rasmussen", email = "thomas@gibfest.dk"}]
name = "bma"
description = "BornHack Media Archive Django project"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]


########## DEPENDENCIES ##########
dependencies = [
    "demoji==1.1.0",
    "Django==5.1.8",
    "django-allauth[socialaccount]==65.7.0",
    "django-bootstrap5==25.1",
    "django-cleanup==9.0.0",
    "django-cors-headers==4.7.0",
    "django-decorator-include==3.3",
    "django-filter==25.1",
    "django-guardian==2.4.0",
    "django-htmx==1.23.0",
    "django-ninja==1.4.1",
    "django-oauth-toolkit==3.0.1",
    "django-polymorphic==3.1.0",
    "django-stubs-ext==5.1.3",
    "django-tables2==2.7.5",
    "django-taggit==6.1.0",
    "environs[django]==14.1.1",
    "fontawesomefree==6.6.0",
    "orjson==3.10.16",
    "psycopg2-binary==2.9.10",
    "shortuuid==1.0.13",
]
[project.optional-dependencies]
dev = [
    "pre-commit==4.2.0",
    "setuptools_scm==8.2.0",
]
test = [
    "beautifulsoup4==4.13.3",
    "coverage==7.8.0",
    "django-debug-toolbar==5.1.0",
    "factory-boy==3.3.3",
    "pytest-django==4.10.0",
    "pytest-cov==6.1.1",
    "pytest-randomly==3.16.0",
    "tox==4.25.0",
]

[project.urls]
homepage = "https://github.com/bornhack/bma"

[project.scripts]
"manage.py" = "bma.manage:main"


########## SETUPTOOLS ##########
[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]


########## RUFF ##########
[tool.ruff]
target-version = "py311"
extend-exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*.py"
]
lint.select = ["ALL"]
lint.ignore = [
    "G004", # https://docs.astral.sh/ruff/rules/logging-f-string/
    "ANN101", # https://docs.astral.sh/ruff/rules/missing-type-self/
    "ANN102", # https://docs.astral.sh/ruff/rules/missing-type-cls/
    "EM101", # https://docs.astral.sh/ruff/rules/raw-string-in-exception/
    "EM102", # https://docs.astral.sh/ruff/rules/f-string-in-exception/
    "COM812", # missing-trailing-comma (https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules)
    "ISC001", # single-line-implicit-string-concatenation (https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules)
    "ARG001", # https://docs.astral.sh/ruff/rules/unused-function-argument/
    "ARG002", # https://docs.astral.sh/ruff/rules/unused-method-argument/
    "ARG004", # https://docs.astral.sh/ruff/rules/unused-static-method-argument/
]
line-length = 120

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*test*.py" = [
    "S101", # https://docs.astral.sh/ruff/rules/assert/
    "PLR2004", # https://docs.astral.sh/ruff/rules/magic-value-comparison/
    "PT009", # https://docs.astral.sh/ruff/rules/pytest-unittest-assertion/
    "S106", # https://docs.astral.sh/ruff/rules/hardcoded-password-func-arg/
    "PLR0912", # https://docs.astral.sh/ruff/rules/too-many-branches/
    "PLR0915", # https://docs.astral.sh/ruff/rules/too-many-statements/
    "C901", # https://docs.astral.sh/ruff/rules/complex-structure/
    "D", # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "ANN201", # https://docs.astral.sh/ruff/rules/missing-return-type-undocumented-public-function/
    "SLF001", # https://docs.astral.sh/ruff/rules/private-member-access/
    "TRY003", # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
]
"*/migrations/*" = [
    "D" # https://docs.astral.sh/ruff/rules/#pydocstyle-d
]

########## PYTEST ##########
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bma.settings"
python_files = ["tests/test_*.py"]
log_cli = 1
log_cli_level = "DEBUG"
filterwarnings = [
    "error",
    # https://github.com/vitalik/django-ninja/issues/1093
    "ignore::DeprecationWarning",
]
addopts = "--cov=. --cov-report=xml --cov-report=html --cov-config=../pyproject.toml"


########## MYPY ##########
[tool.mypy]
plugins = [
    "mypy_django_plugin.main"
]
mypy_path = "src"
ignore_missing_imports = true
disallow_subclassing_any = false
strict = true

[tool.django-stubs]
django_settings_module = "bma.settings"

[tool.mypy_django_plugin]
ignore_missing_model_attributes = true


########## TOX ##########
[tool.tox]
envlist = ["py311", "py312", "py313"]
skipsdist = true

[tool.tox.env_run_base]
description = "Run tests under {base_python}"
changedir = "src"

deps = [
    "-e.[test]",
]
commands = [["pytest"]]


########## COVERAGE.PY ##########
[tool.coverage.run]
omit = [
    "*/tests.py",
    "*/tests/test_*.py",
]
[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING",
]
