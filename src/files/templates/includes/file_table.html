{% load django_bootstrap5 %}
{% load render_table from django_tables2 %}
        <form action="{% url 'files:file_multiple_action' %}" method="POST">
        <div class="row">
          <div class="col">
            <div class="btn-toolbar" role="toolbar" aria-label="Toolbar with button groups">
              <div class="btn-group me-2 mb-3" role="group" aria-label="Toggle filters button">
                <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#FileFilters" aria-expanded="false" aria-controls="FileFilters">
                  <i class="fas fa-filter"></i> Toggle Filters
                </button>
              </div>
              <div class="input-group me-2 mb-3" role="group" aria-label="File actions form">
                <span class="input-group-text" id="inputGroup-sizing-default">Action</span>
                <input type="hidden" name="fromurl" value="{{ request.path }}{% querystring %}"></input>
                {% bootstrap_field file_action_form.action show_label=False wrapper_class="" %}
                <button type="submit" class="btn btn-success">Do it</button>
              </div>
              <div class="btn-group me-2 mb-3" role="group" aria-label="Pagination buttons">
                <a href="{% querystring per_page=25 %}" class="btn btn-outline-primary">Show 25/page</a>
                <a href="{% querystring per_page=100 %}" class="btn btn-outline-primary">Show 100/page</a>
                <a href="{% querystring per_page=250 %}" class="btn btn-outline-primary">Show 250/page</a>
                <a href="{% querystring per_page=1000 %}" class="btn btn-outline-primary">Show 1000/page</a>
              </div>
            </div>
          </div>
        </div>
        {% csrf_token %}
        <div class="table-responsive-4xl">
        {% render_table table %}
        </div>
        </form>
